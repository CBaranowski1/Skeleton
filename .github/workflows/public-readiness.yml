name: Public readiness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: 3.14.6
      - name: Enforce public-tree boundaries
        run: python .github/scripts/public_readiness.py
      - name: Scan complete Git history with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --volume '${{ github.workspace }}:/repo' \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git . --config .gitleaks.toml --redact=100 --no-banner --verbose
      - name: Scan current tree and nested archives with Gitleaks
        shell: bash
        run: |
          docker run --rm \
            --volume '${{ github.workspace }}:/repo' \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir . --config .gitleaks.toml --max-archive-depth 3 --redact=100 --no-banner --verbose
