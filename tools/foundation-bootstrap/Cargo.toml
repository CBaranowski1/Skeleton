[package]
name = "skeleton-foundation-bootstrap"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "skeleton_foundation_bootstrap"
path = "src/lib.rs"

[[bin]]
name = "FoundationBootstrapSigner"
path = "src/bin/foundation_bootstrap_signer.rs"

[[bin]]
name = "FoundationTerminalVerifier"
path = "src/bin/foundation_terminal_verifier.rs"

[[bin]]
name = "foundation-package-builder"
path = "src/bin/foundation_package_builder.rs"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.11.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography"] }
