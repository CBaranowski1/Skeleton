[package]
name = "skeleton-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "skeleton-contracts"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
serde_json_canonicalizer = { version = "=0.4.1", default-features = false }
ed25519-dalek = { version = "=3.0.0", default-features = false }
jsonschema = { version = "=0.58.6", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
